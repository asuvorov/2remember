{% load i18n %}
{% load urls %}

{% comment %}
    Input Parameters:
        :<request> - Request

        :<collections> - List of Collections
{% endcomment %}

<div class="controllers">
    <a class="btn btn-secondary" data-toggle="collapse" href="#collapse-collection-filter" aria-expanded="false" aria-controls="collapse-collection-filter"><i class="bi bi-filter"></i> {% trans "Filter" %}</a>
{% if request.user.is_authenticated %}
    <a class="btn btn-primary {% if not create_collection_eligible %}disabled{% endif %}" href="{% url 'collection-create' %}" data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-html="true" data-bs-title="{% for details in create_collection_details %}{% if details.0 %}<i class='accept bi bi-check-lg'></i>{% else %}<i class='reject bi bi-x-lg'></i>{% endif %} {{ details.1 }}{% if not forloop.last %}<br/>{% endif %}{% endfor %}"><i class="bi bi-plus-circle"></i> {% trans "Create" %}</a>
{% endif %}
</div>
