{% load i18n %}

{% comment %}
    Input Parameters:
        :<request> - Request

        :<collections> - List of Collections
{% endcomment %}

<div class="row g-2 mb-3">
{% for collection in collections %}
    <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        {% include "collections/fragments/collection-thumbnail-vert.html" %}
    </div>
{% empty %}
    <div class="col-12">
        <span class="badge text-bg-warning">{% trans "There are no created Collection at the Moment" %}</span>
    </div>
{% endfor %}
</div>

<div class="row g-2">
    <div class="col-12">
        <!-- <div id="page-selection" class="position-absolute bottom-0 start-50 translate-middle-x"></div> -->
        <div id="page-selection" class="my-3"></div>
    </div>
</div>
