{% load cache %}
{% load static %}
{% load urls %}

{% comment %}
    Input Parameters:
        :<request> - Request

        :<page_total>  - Total Number of Pages
        :<page_number> - Number of current Page
{% endcomment %}

{% cache 3600 faq-thumb-search LANGUAGE_CODE %}
<script>
    /*************************************************************************/
    /*** AJAX Spinner                                                      ***/
    /*************************************************************************/
    $(document).ajaxStart(function () {
        $("#spinner").fadeIn("slow");
    });
    $(document).ajaxStop(function () {
        $("#spinner").fadeOut("slow");
    });

    /*************************************************************************/
    /*** Custom Scripts                                                    ***/
    /*************************************************************************/
    // ------------------------------------------------------------------------
    // --- Fix Footer.
    //$('a[data-toggle="tab"]').on("shown.bs.tab", function (e) {
    //    fixFooter();
    //})

    function fixFooter() {
        $("#wrapper").css({
            "height":       "auto"
        })
        $("#footer").css({
            "margin-top":   "0px"
        });

        var windowHeight = window.innerHeight;
        var wrapperHeight = $("#wrapper").height();
        var footerHeight = $("#footer").height();

        console.log(">>> windowHeight  :", windowHeight);
        console.log(">>> wrapperHeight :", wrapperHeight);
        console.log(">>> footerHeight  :", footerHeight);

        if (wrapperHeight < windowHeight) {
            $("#wrapper").height(windowHeight + "px");
            $("#footer").css({
                "position": "absolute",
                "bottom":   "0"
            });
        } else {
            $("#footer").css({
                "position": "relative"
            });
        }
    }

    /*************************************************************************/
    /*** Bootstrap Plug-ins                                                ***/
    /*************************************************************************/
    // ------------------------------------------------------------------------
    // --- Initialize Tooltips.
    $(document).ready(function () {
        const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
        const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));
    });

    // ------------------------------------------------------------------------
    // --- Initialize Date Picker.

    // ------------------------------------------------------------------------
    // --- Initialize Max Length.
    $("input[maxlength]").maxlength({
        alwaysShow:         false,
        threshold:          25,
        warningClass:       "badge text-bg-warning",
        limitReachedClass:  "badge text-bg-danger",
        placement:          "top-right-inside",
        validate:           true
    });
    $("textarea[maxlength]").maxlength({
        alwaysShow:         true,
        threshold:          50,
        warningClass:       "badge text-bg-success",
        limitReachedClass:  "badge text-bg-danger",
        placement:          "top-right-inside",
        validate:           true
    });

    // ------------------------------------------------------------------------
    // --- Initialize Tags Input.
    $("#id_tags").tagsinput("refresh");

    // ------------------------------------------------------------------------
    // --- Initialize Tool Tips
    $("[data-toggle='tooltip']").tooltip({
        animation:          true,
        delay:              0,
        trigger:            "hover",
    });

    /*************************************************************************/
    /*** jQuery Plugins                                                    ***/
    /*************************************************************************/
    // ------------------------------------------------------------------------
    // --- Initialize Bootpag.
    $("#page-selection").bootpag({
        total:          "{{ page_total }}",
        maxVisible:     5,
        page:           "{{ page_number }}",
        leaps:          true,
        prev:           "<i class='bi bi-chevron-double-left'></i>",
        next:           "<i class='bi bi-chevron-double-right'></i>",
        href:           "{% url_params current_url page=page_number %}",  // "?page={{ page_number }}",
        hrefVariable:   "{{ page_number }}",
        firstLastUse:   true,
        first:          "<i class='bi bi-arrow-left'></i>",
        last:           "<i class='bi bi-arrow-right'></i>",
        wrapClass:      "pagination justify-content-center",
        activeClass:    "active",
        disabledClass:  "disabled",
        nextClass:      "next",
        prevClass:      "prev",
        lastClass:      "last",
        firstClass:     "first"
    }).on("page", function (event, page_num) {
        console.log(">>> PAGE:", page_num);
    });

    // ------------------------------------------------------------------------
    // --- Initialize Color Box.
    $(".gallery-photos").colorbox({
        rel:            "gallery-photos",
        transition:     "fade",
        scalePhotos:    true,
        scrolling:      true,
        loop:           true,
        // height:  "100%",
        // width:   "100%",
        maxHeight:      "90%",
        maxWidth:       "90%"
    });

    $(".gallery-videos").colorbox({
        rel:            "gallery-videos",
        transition:     "fade",
        scalePhotos:    true,
        scrolling:      true,
        loop:           true,
        // height:  "100%",
        // width:   "100%",
        maxHeight:      "90%",
        maxWidth:       "90%",
        iframe:         true
    });

    // ------------------------------------------------------------------------
    // --- Initialize Noty.
    Noty.overrideDefaults({
        type:           "error",
        layout:         "topRight",
        theme:          "bootstrap-v3",         // or "relax"
        text:           "",
        timeout:        3000,                   // delay for closing event. Set false for sticky notifications
        progressBar:    true,
        closeWith:      ["click"],              // ["click", "button"].
        animation: {
            open:       "animated bounce",      // Animate.css class names
            close:      "animated flipOutX",    // Animate.css class names
            easing:     "swing",                // unavailable - no need
            speed:      500                     // unavailable - no need
        },
        modal:          false,
        force:          true,                   // adds notification to the beginning of queue when set to true
        dismissQueue:   true,                   // If you want to use queue feature set this true
        killer:         false,                  // for close all notifications before show
        template:       "<div class='noty_message'><span class='noty_text'></span><div class='noty_close'></div></div>",
        maxVisible:     10,                     // you can set max visible notification for dismissQueue true option,
        callback: {
            onShow:         function () {},
            afterShow:      function () {},
            onClose:        function () {},
            afterClose:     function () {},
            onCloseClick:   function () {},
        },
        buttons:        false                   // an array of buttons
    });

    // ------------------------------------------------------------------------
    // --- Initialize pop-up Overlays.

    // ------------------------------------------------------------------------
    // --- Initialize Read more.
    $("blockquote.readmore").readmore({
        speed:              100,
        collapsedHeight:    100,
        heightMargin:       16,
        moreLink:           "<a href='#'>Read more...</a>",
        lessLink:           "<a href='#'>Read less...</a>",
        embedCSS:           true,
        blockCSS:           "display: block; width: 100%;",
        startOpen:          false,
        beforeToggle:       function() {},
        afterToggle:        function() {},
        blockProcessed:     function() {}
    });

    $(document).ready(function () {
        // --------------------------------------------------------------------
        // --- Alter YouTube Video Links.
        // --------------------------------------------------------------------
        $("a.gallery-videos").each(function () {
            var newUrl = $(this).attr("href").replace("youtube.com/watch?v=", "youtube.com/v/");
            $(this).attr("href", newUrl);
        });

        // --------------------------------------------------------------------
        // --- Pagination Styles.
        // --------------------------------------------------------------------
        $("ul.pagination li").addClass("page-item");
        $("ul.pagination li a").addClass("page-link");
    });
</script>
{% endcache %}
